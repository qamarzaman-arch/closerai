services:
  backend:
    build: ./apps/server
    ports:
      - "3001:3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./apps/server/prisma:/app/prisma

  # Frontend is usually a native desktop build, but for testing/web version:
  frontend:
    build: ./apps/electron
    ports:
      - "5173:5173"
